<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1 class="app-title">TIC TAC TOE</h1>
        </header>

        <main class="app-main">
            <div class="status-bar" id="status-bar">
                <span id="status-text">Player X's Turn</span>
            </div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; April 2026 <i>Linggar Ramadhan</i></p>
        </footer>
    </div>

    <!-- JAVASCRIPT -->
    <script src="assets/js/app.js"></script>
</body>
</html>
