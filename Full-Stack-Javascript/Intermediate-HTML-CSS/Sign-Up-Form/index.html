<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up From - byOdin</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">

        <!-- SIDE KIRI -->
        <div class="sidebar">
            <div class="logo-wrapper">
                <img src="assets/images/logo.png" alt="logo" class="logo-img">
                <span class="logo-text">Odin Project</span>
            </div>
            <p class="photo-credit">Photo by <a href="https://unsplash.com" target="_blank">Unsplash</a></p>
        </div>

        <!-- SIDE KANAN -->
        <div class="main-content">
            <div class="intro">
                <p>Already have a confident Linux installation and a fast web browser? Why not take it a step further and try something <strong>new</strong>?</p>
            </div>

            <div class="form-card">
                <h2>Let's do this!</h2>
                <p>Enter your information below to create your account</p>

                <form action="#" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstName" name="firstname" placeholder="First Name" required />
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastName" name="lastname" placeholder="Last Name" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Email" required />
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" name="phone" id="phone" placeholder="Phone Number" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" name="password" id="password" placeholder="Password" minlength="8" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm Password" minlength="8" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-create">Create account</button>
                        <p>Already have an account? <a href="#">Log in</a></p>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <footer>&copy; April 2026 <i>Linggar Ramadhan</i></footer>

    <!-- JAVASCRIPT -->
    <script src="assets/js/main.js"></script>
</body>
</html>
