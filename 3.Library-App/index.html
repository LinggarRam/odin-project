<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Library App</title>
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body>
        <header class="header">
            <h1>My Library Book</h1>
            <button class="btn-new" id="btn-new-book">New Book</button>
        </header>

        <main>
            <div class="books-grid" id="books-grid"></div>
        </main>

        <dialog id="book-dialog">
            <form id="book-form">
                <h2>Add New Book</h2>

                <div class="form-group">
                    <label for="title">Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Book Title"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input
                        type="text"
                        id="author"
                        placeholder="Author Name"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="pages">Pages</label>
                    <input
                        type="number"
                        id="pages"
                        placeholder="Number of Pages"
                        min="1"
                        required
                    />
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="read" />
                    <label for="read">Already read?</label>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Add Book</button>
                    <button type="button" class="btn-cancel" id="btn-cancel">
                        Cancel
                    </button>
                </div>
            </form>
        </dialog>

        <footer class="footer">
            <p>&copy; April 2026 <i>Linggar Ramadhan</i></p>
        </footer>

        <!-- JAVASCRIPT -->
        <script src="assets/js/main.js"></script>
    </body>
</html>
