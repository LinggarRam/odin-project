<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">Todo List</h1>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-title">My Projects</div>
                <ul class="project-list" id="project-list"></ul>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-add-project" id="btn-add-project">+ New Project</button>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
                <h2 class="project-title" id="project-title">Select a Project</h2>
                <button class="btn-add-todo" id="btn-add-todo">+ Add Todo</button>
            </div>
            <div class="todo-list" id="todo-list"></div>
        </main>
    </div>

    <dialog id="todo-dialog">
        <form id="todo-form">
            <h2 id="dialog-title">Add New Todo</h2>

            <div class="form-group">
                <label for="todo-title">Title</label>
                <input type="text" id="todo-list" placeholder="What needs to be done?" required />
            </div>

            <div class="form-group">
                <label for="todo-desc">Description</label>
                <textarea id="todo-desc" placeholder="Add a description..." rows="3"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="todo-date">Due Date</label>
                    <input type="date" id="todo-date" required />
                </div>
                <div class="form-group">
                    <label for="todo-priority">Priority</label>
                    <select id="todo-priority">
                        <option value="low">🟢 Low</option>
                        <option value="medium">🟡 Medium</option>
                        <option value="high">🔴 High</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="todo-notes">notes</label>
                <textarea id="todo-notes" placeholder="Additional notes..." rows="2"></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-submit" id="btn-submit">Add Todo</button>
                <button type="button" class="btn-cancel" id="btn-cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="project-dialog">
        <form id="project-form">
            <h2>New Project</h2>
            <div class="form-group">
                <label for="project-name"></label>
                <input type="text" id="project-name" placeholder="e.g. Work, Personal...." required />
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn-submit">Create</button>
                <button type="button" class="btn-cancel" id="btn-cancel-project">Cancel</button>
            </div>
        </form>
    </dialog>
</body>
</html>
